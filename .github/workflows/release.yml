name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v7

      - name: Select toolchain
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Check the tag matches Info.plist
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" scripts/Info.plist)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: swift run SandglassTests

      - name: Build and pack
        run: |
          scripts/release.sh
          cd build
          shasum -a 256 "Sandglass-$VERSION.zip" > "Sandglass-$VERSION.zip.sha256"
          cat "Sandglass-$VERSION.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/Sandglass-$VERSION.zip" "build/Sandglass-$VERSION.zip.sha256" \
            --title "Sandglass $VERSION" --generate-notes
